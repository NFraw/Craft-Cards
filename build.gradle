plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.144'
}

apply from: 'common/gradle/minecraft-target.gradle'
version = mod_version
group = mod_group_id

repositories {
    // 先清空默认配置，避免 Gradle 仍然尝试连接慢速源
    repositories.clear()

    // 添加阿里云镜像（国内最快之一）
    maven {
        url = "https://maven.aliyun.com/repository/public"
    }
    maven {
        url = "https://maven.aliyun.com/repository/gradle-plugin"
    }

    // NeoForge 官方必要的仓库（保留）
    maven {
        url = "https://libraries.minecraft.net/"
    }
    maven {
        url = "https://neoforged.forgecdn.net/releases"
    }
    maven {
        url = "https://neoforged.forgecdn.net/mojang-meta"
    }

    mavenCentral()
}

base {
    archivesName = mod_id + (mcArtifactSuffix ? '-neoforge' + mcArtifactSuffix : '')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            programArgument "--username=Player1"

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // 联机测试用的第二/三个客户端：独立游戏目录（避免日志/配置互锁）+ 独立玩家名
        // （offline 模式下同名=同 UUID，后加入的玩家会把前面的顶下线）
        client2 {
            client()
            gameDirectory = project.file('run2')
            programArgument "--username=Player2"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client3 {
            client()
            gameDirectory = project.file('run3')
            programArgument "--username=Player3"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client4 {
            client()
            gameDirectory = project.file('run4')
            programArgument "--username=Player4"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // 独立游戏目录：与 client 共用 run/ 时，跑一次 GameTest 就会把 Player1 客户端的
            // run/logs/latest.log 覆盖掉（同一个文件两个进程写），排查问题时最需要的那份日志
            // 反而没了；顺带也不再往 run/ 里塞测试用的 world/。测试自己钉住配置前提
            // （DDZTestSupport.forceBettingDefaults），不依赖 run/config 里的值。
            gameDirectory = project.file('run-gametest')
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('common/src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (mcRunSuffix) gameDirectory = project.file("run-${name}${mcRunSuffix}")
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 保险：MDG 的 prepareXxxRun 把启动参数写到 build/moddev/ 下，而 devlaunch 的 JVM 一启动就要读
// <runName>RunVmArgs.txt——文件不在就直接 FATAL（"could not open ...clientRunVmArgs.txt"）。
// build/ 被清理（clean、IDE rebuild）后若该任务被判为已是最新，runClient 就会以这种难懂的方式失败。
// 这里补一层判定：文件不存在就不算最新，强制重新生成。文件在时行为与默认完全一致。
def runConfigs = ['client', 'client2', 'client3', 'client4', 'server', 'data', 'gameTestServer']
runConfigs.each { runName ->
    def vmArgsFile = layout.buildDirectory.file("moddev/${runName}RunVmArgs.txt")
    tasks.matching { it.name == "prepare${runName.capitalize()}Run" }.configureEach { prepareTask ->
        prepareTask.outputs.upToDateWhen { vmArgsFile.get().asFile.exists() }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// 多加载器：common/ 是**两侧共用**的源码树（见 docs/多加载器改造方案.md）。
// 它不是独立的 Gradle 工程——只是让两边各自把这一目录加进源集：
// 这边（NeoForge）与 src/main/java 一起编译，Fabric 那边（fabric/build.gradle）同样加一次。
// 判定一个文件能不能放进 common/ 的唯一标准：**它不 import 任何加载器类**
// （net.neoforged / net.minecraftforge）。现有 82 个源文件里 50 个满足。
sourceSets.main.java { srcDir 'common/src/main/java' }
sourceSets.main.resources { srcDir 'common/src/main/resources' }

if (project.hasProperty('pocSmoke')) {
    sourceSets {
        smoke {
            java.srcDir 'common/src/smoke/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge {
        mods { crafty_cards_smoke { sourceSet sourceSets.smoke } }
        runs {
            configureEach {
                loadedMods = name.startsWith('smoke')
                    ? [project.neoForge.mods.crafty_cards, project.neoForge.mods.crafty_cards_smoke]
                    : [project.neoForge.mods.crafty_cards]
            }
            smokeServer {
                server()
                sourceSet = sourceSets.smoke
                gameDirectory = project.file("run-smoke-server${mcRunSuffix}")
                programArguments.addAll '--nogui', '--port', '25576'
                jvmArgument '-Xmx768m'
            }
            (1..3).each { n ->
                create("smokeClient${n}") {
                    client()
                    sourceSet = sourceSets.smoke
                    gameDirectory = project.file("run-smoke-client${n}${mcRunSuffix}")
                    programArguments.addAll '--username', "Smoke${n}".toString(), '--width', '960', '--height', '640'
                    jvmArgument '-Xmx768m'
                }
            }
        }
    }
    ext.pocRepositoryRoot = project.projectDir
    ext.pocRunConfig = { name ->
        def launch = tasks.getByName('run' + name.capitalize())
        launch.classpath(launch.classpathProvider)
        launch.environment.putAll(launch.environmentProperty.get())
        // Java does not expand nested @files. The shared launcher puts this text
        // directly in its outer argument file, before the classpath/main class.
        [runDir: launch.gameDirectory.get().asFile.absolutePath, vmArgs: [],
         rawVmArgs: layout.buildDirectory.file("moddev/${name}RunVmArgs.txt").get().asFile.getText('UTF-8'),
         mainClass: launch.mainClass.get(),
         programArgs: ['@' + layout.buildDirectory.file("moddev/${name}RunProgramArgs.txt").get().asFile.absolutePath]]
    }
    apply from: 'common/gradle/poc-smoke.gradle'
}

// GameTest 是开发期专用：类与测试结构不该进发布包（它们在正式环境不会被加载，属无谓体积）
tasks.named('jar', Jar) {
    exclude 'com/jokernan/craftycards/gametest/**'
    exclude 'data/crafty_cards/structure/**'
    // 模组不含任何音频：音效与 BGM 全部来自玩家安装的音乐包（仓库根目录 soundpacks/ 下附官方默认包，
    // 由玩家自行放入 config/crafty_cards/soundpacks/）。这样"音频从哪来、由谁负责"始终在玩家手上。
    // 单测 CustomAudioTest.modResourcesContainNoAudio 会挡住把 .ogg 放回 resources 的提交，这里是发布侧兜底。
    exclude '**/*.ogg'
}


dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    // 必须显式指定：默认按平台字符集处理模板，中文会变成乱码
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

test {
    useJUnitPlatform()
    inputs.dir('common/src/main/resources')
    // CustomAudioTest.makerLabelsMatchGameLabels 是跨语言守卫：它会读这个脚本，把里面的
    // 中文名与 CustomAudio.label() 逐字比对。脚本不是 .java，不声明成输入的话，只改工具
    // 脚本时 Gradle 会判定测试"无需重跑"——守卫就永远不会响，白设。
    inputs.file('tools/soundpack_maker.py')
        .withPropertyName('soundpackMakerScript')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

apply from: 'common/gradle/version-sources.gradle'
