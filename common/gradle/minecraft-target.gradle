def target = providers.gradleProperty('mcTarget').getOrElse('1.21.5')
if (target != '1.21.5') throw new GradleException('This branch only supports Minecraft 1.21.5')
if (!targets.containsKey(target))
    throw new GradleException("Unsupported mcTarget '${target}'. Supported: ${targets.keySet().join(', ')}")
def selected = targets[target]
ext.mcMinor = target == '1.21' ? 0 : target.tokenize('.').last().toInteger()
ext.modernTarget = mcMinor >= 2
ext.resourcePackFormat = [0:34, 1:34, 2:42, 3:42, 4:46, 5:55, 6:63, 7:64, 8:64, 9:69, 10:69, 11:75][mcMinor]
