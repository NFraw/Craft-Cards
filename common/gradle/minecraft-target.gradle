// Registered targets. Build/runtime evidence is tracked separately in versions/.
def targets = [
    '1.21.10': [neo: '21.10.64', fabric: '0.138.4+1.21.10', forge: '60.1.15', mcRange: '[1.21.10,1.21.11)', neoRange: '[21.10.64,21.11)', forgeRange: '[60.1.15,61)', fml: '[60,)']
]
def target = providers.gradleProperty('mcTarget').getOrElse('1.21.10')
if (target != '1.21.10') throw new GradleException('This branch only supports Minecraft 1.21.10')
if (!targets.containsKey(target))
    throw new GradleException("Unsupported mcTarget '${target}'. Supported: ${targets.keySet().join(', ')}")
def selected = targets[target]
ext.mcMinor = target == '1.21' ? 0 : target.tokenize('.').last().toInteger()
ext.modernTarget = mcMinor >= 2
ext.resourcePackFormat = [0:34, 1:34, 2:42, 3:42, 4:46, 5:55, 6:63, 7:64, 8:64, 9:69, 10:69, 11:75][mcMinor]
ext.dataPackFormat = [0:48, 1:48, 2:57, 3:57, 4:61, 5:71, 6:80, 7:81, 8:81, 9:88, 10:88, 11:94][mcMinor]
ext.minecraft_version = target
ext.minecraft_version_range = selected.mcRange
ext.neo_version = selected.neo
ext.neo_version_range = selected.neoRange
ext.fabric_version = selected.fabric
ext.forge_version = selected.forge
ext.forge_version_range = selected.forgeRange
ext.forge_loader_version_range = selected.fml
ext.mcArtifactSuffix = "-mc${target}"
ext.mcRunSuffix = target == '1.21.1' ? '' : "-${target}"
if (project.hasProperty('pocSmoke')) {
    ext.pocRunId = providers.gradleProperty('pocRunId').getOrElse(java.util.UUID.randomUUID().toString())
    if (!(pocRunId ==~ /[A-Za-z0-9_-]{1,80}/)) throw new GradleException('Invalid pocRunId')
    ext.mcRunSuffix += "-acceptance-${pocRunId}"
}
layout.buildDirectory = file("build/mc-${target}")
