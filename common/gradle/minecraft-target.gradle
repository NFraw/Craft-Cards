ext.fabric_version = selected.fabric
ext.forge_version = selected.forge
ext.forge_version_range = selected.forgeRange
ext.forge_loader_version_range = selected.fml
ext.mcArtifactSuffix = target == '1.21.1' ? '' : "-mc${target}"
ext.mcRunSuffix = target == '1.21.1' ? '' : "-${target}"
if (project.hasProperty('pocSmoke')) {
    ext.pocRunId = providers.gradleProperty('pocRunId').getOrElse(java.util.UUID.randomUUID().toString())
    if (!(pocRunId ==~ /[A-Za-z0-9_-]{1,80}/)) throw new GradleException('Invalid pocRunId')
    ext.mcRunSuffix += "-acceptance-${pocRunId}"
}
if (target != '1.21.1') layout.buildDirectory = file("build/mc-${target}")
