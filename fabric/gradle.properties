# Fabric 子工程：只写构建需要的属性。注意这个文件也按 ISO-8859-1 解析，不要写非 ASCII 字符。
# user.language=en：javac 的诊断默认跟随系统语言，中文在控制台里常被编码搞成乱码，
# 报错看不清（"找不到符号"后面那个符号名最要紧）。这里强制英文，报错可直接读。
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.parallel=true
org.gradle.caching=true
# Loom 对 Gradle 配置缓存的支持历来有坑，这里显式关掉（根目录 NeoForge 那边开着，互不影响）
org.gradle.configuration-cache=false

# Minecraft / Fabric API versions: common/gradle/minecraft-target.gradle
# Fabric Loader 与 MC 版本无关（向后兼容），取当前最新即可
loader_version=0.19.5

mod_id=crafty_cards
mod_name=Crafty Cards
mod_version=1.0.0
mod_group_id=com.jokernan.craftycards
mod_authors=JokerNan
mod_license=GPL-3.0-only
