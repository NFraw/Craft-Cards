// Fabric 侧是**独立构建**（自己的 Gradle 版本与依赖），与根目录的 NeoForge 构建互不干扰：
// 两个加载器的构建工具链差别很大（MDG vs Loom），塞进同一个 build 只会互相拖累；
// 共用的是 ../common 里的源码/资源，不是 Gradle 配置。
pluginManagement {
    plugins {
        id 'fabric-loom' version (providers.gradleProperty('mcTarget').getOrElse('1.21.5') in ['1.21', '1.21.1'] ? '1.7.4' : '1.13.6')
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'crafty-cards-fabric'
