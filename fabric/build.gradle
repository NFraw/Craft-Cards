plugins {
    id 'fabric-loom'
}

apply from: '../common/gradle/minecraft-target.gradle'
version = project.mod_version
group = project.mod_group_id
base {
    archivesName = "${project.mod_id}-fabric${mcArtifactSuffix}"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'AliyunPublic'
        url = 'https://maven.aliyun.com/repository/public'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // **官方（Mojang）映射，不是 Yarn** ——这条是整个多加载器方案的基石：
    // common/ 里的源码要在 NeoForge 与 Fabric 两侧**逐字共用**，而 NeoForge 用的就是官方名
    // （net.minecraft.world.level.block.Block 这一套）。若这里用 Yarn，同一个文件在两边类名/
    // 方法名完全不同，"共用一份源码"就无从谈起。NeoForge 官方的 MultiLoader 模板同样如此。
    // 代价：查 Fabric 社区文档时的示例代码是 Yarn 名，需要自行对照。
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // common/ 的源码用 javax.annotation.Nullable（JSR-305）。NeoForge 的类路径自带它，
    // Loom 这边没有——不补的话 common 里所有带 @Nullable 的文件全部编译不过（实测 14 处）。
    // 只用于编译期注解，故 compileOnly。
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// 备用输出目录：`-PverifyBuild` 时把产物写到 build/verify/ 而不是 build/。
// 用途是"客户端还在跑的时候想验证改动能不能编译"——开发运行的客户端是按需从
// build/classes/ 加载类的，直接构建有可能让它在加载某个类的瞬间崩掉（NeoForge 侧踩过：
// javac 先删后写，正在加载的客户端抛 NoClassDefFoundError 并被 JVM 永久缓存）。
// build/verify/ 在 build/ 之下，仍被 .gitignore 覆盖。
if (project.hasProperty('verifyBuild')) {
    layout.buildDirectory = new File(layout.buildDirectory.get().asFile, 'verify')
}

// 运行配置：**每个实例一个独立游戏目录**。
// 独立目录有两个理由：①多个实例共享 run/ 时，日志文件会被互相覆盖（NeoForge 侧踩过）：
// ②服务端与客户端的 world/、options.txt 混在一起也难清理。
// 联机测试要的 client2/3/4 在后面按下标加即可（与 NeoForge 侧 run2/run3/run4 同一套做法）。
loom {
    runs {
        client {
            client()
            runDir "run${mcRunSuffix}"
            programArgs '--username=Player1'
            // 把注入后的类导出到 run/.mixin.out/，用来**证明 mixin 真的应用了**
            // （Mixin 找不到目标时只在日志里给一条错误，游戏照常跑——"没报错"不等于"注入了"）
            vmArgs '-Dmixin.debug.export=true'
        }
        // 联机测试用的第二/三个客户端：独立游戏目录 + 独立玩家名
        // （offline 模式下同名 = 同 UUID，后进的会把前面的顶下线，与 NeoForge 侧同一套做法）
        client2 {
            client()
            runDir "run2${mcRunSuffix}"
            programArgs '--username=Player2'
        }
        client3 {
            client()
            runDir "run3${mcRunSuffix}"
            programArgs '--username=Player3'
        }
        server {
            server()
            runDir "run-server${mcRunSuffix}"
            programArgs '--nogui'
        }
    }
}

// 多加载器：common/ 是两侧共用的源码树（见 docs/多加载器改造方案.md）。
// 它与根目录（NeoForge）构建里挂的是**同一批文件**；判定标准：不出现任何加载器类型。
sourceSets.main {
    java { srcDir '../common/src/main/java' }
    // 方块模型、贴图、语言、配方与掉落表共用 common 资源树。
    resources { srcDir '../common/src/main/resources' }
}

sourceSets.test.java.srcDir '../src/test/java'
test {
    useJUnitPlatform()
    workingDir rootProject.file('..')
    inputs.file('../tools/soundpack_maker.py')
    inputs.dir('../common/src/main/resources')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach { exclude '**/*.ogg' }

// fabric.mod.json 里的 ${version} / ${mod_id} 由这里替换；中文描述会乱码，故显式指定 UTF-8
processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', project.mod_id
    inputs.property 'minecraft_version', project.minecraft_version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'mod_id': project.mod_id, 'minecraft_version': project.minecraft_version
    }
    // 与 NeoForge 侧的 jar 保持一致的裁剪：GameTest 用的结构文件不进发布包
    exclude 'data/crafty_cards/structure/**'
}

// Opt-in, separate development mod. Never included in either release jar.
if (project.hasProperty('pocSmoke')) {
    sourceSets {
        smoke {
            java.srcDir '../common/src/smoke/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    loom {
        mods {
            crafty_cards { sourceSet sourceSets.main }
            crafty_cards_smoke { sourceSet sourceSets.smoke }
        }
        runs {
            smokeServer {
                server()
                source sourceSets.smoke
                runDir "run-smoke-server${mcRunSuffix}"
                programArgs '--nogui', '--port', '25576'
                vmArgs '-Xmx768m'
            }
            (1..3).each { n ->
                create("smokeClient${n}") {
                    client()
                    source sourceSets.smoke
                    runDir "run-smoke-client${n}${mcRunSuffix}"
                    programArgs '--username', "Smoke${n}", '--width', '960', '--height', '640'
                    vmArgs '-Xmx768m', '-Dmixin.debug.export=true'
                }
            }
        }
    }
    ext.pocRunConfig = { name -> net.fabricmc.loom.configuration.ide.RunConfig.runConfig(project, loom.runs.getByName(name)) }
    apply from: '../common/gradle/poc-smoke.gradle'
}

apply from: '../common/gradle/version-sources.gradle'
