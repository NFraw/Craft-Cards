// Mechanical API migrations only. Behavioral differences belong in Java overlays.
ext.adaptVersionSource = { String path, String source ->
    source = source.replace('\r\n', '\n')
    if (portLoader == 'fabric' && mcMinor >= 5 && path.endsWith('/FabricContent.java')) source = source
        .replace('EntityDataSerializers.registerSerializer(stackSerializer);',
            'net.fabricmc.fabric.api.object.builder.v1.entity.FabricTrackedDataRegistry.register(CCReference.location("stack"), stackSerializer);')
    if (path.endsWith('/CustomSoundPack.java')) source = source.replace('RESOURCE_PACK_FORMAT = 34', "RESOURCE_PACK_FORMAT = ${resourcePackFormat}")
    if (mcMinor >= 9 && path.endsWith('/CustomSoundPack.java')) source = source.replace('CustomAudio.packMcMeta(RESOURCE_PACK_FORMAT)',
        '"{\\"pack\\":{\\"min_format\\":[" + RESOURCE_PACK_FORMAT + ",0],\\"max_format\\":[" + RESOURCE_PACK_FORMAT + ",0],\\"description\\":\\"Crafty Cards music pack\\"}}"')
    def itemId = { String name -> "net.minecraft.resources.ResourceKey.create(net.minecraft.core.registries.Registries.ITEM, com.jokernan.craftycards.CCReference.location(\"${name}\"))" }
    def blockId = { String name -> "net.minecraft.resources.ResourceKey.create(net.minecraft.core.registries.Registries.BLOCK, com.jokernan.craftycards.CCReference.location(\"${name}\"))" }
    if (path.endsWith('/ItemCardCovered.java')) {
        source = source.replace('import net.minecraft.world.InteractionResultHolder;', '')
            .replace('InteractionResultHolder<ItemStack>', 'InteractionResult')
            .replace('InteractionResultHolder.success(stack)', 'InteractionResult.SUCCESS')
            .replace('public ItemCardCovered() {', 'public ItemCardCovered() { this("card_covered"); }\n    protected ItemCardCovered(String registryName) {')
            .replace('new Properties().stacksTo(1).durability(54)', 'new Properties().setId(net.minecraft.resources.ResourceKey.create(net.minecraft.core.registries.Registries.ITEM, com.jokernan.craftycards.CCReference.location(registryName))).stacksTo(1).durability(54)')
    }
    if (path.endsWith('/ItemCard.java')) source = source.replace('public ItemCard() {}', 'public ItemCard() { super("card"); }')
    if (path.endsWith('/ItemCardDeck.java')) source = source.replace('new Properties().stacksTo(1)', "new Properties().setId(${itemId('card_deck')}).stacksTo(1)")
    if (path.endsWith('/BlockDDZTable.java')) source = source.replace('Block.Properties.of()', "Block.Properties.of().setId(${blockId('ddz_table')})")
    if (path.endsWith('/InitItems.java')) source = source.replace('BlockBehaviour.Properties.of()', "BlockBehaviour.Properties.of().setId(${blockId('casino_carpet_space')})")
        .replace('new Item.Properties().stacksTo(1)', "new Item.Properties().setId(${itemId('ddz_card')}).stacksTo(1)")
    if (path.endsWith('/BlockItemBase.java')) source = source.replace('new Properties()', 'new Properties().setId(net.minecraft.resources.ResourceKey.create(net.minecraft.core.registries.Registries.ITEM, net.minecraft.core.registries.BuiltInRegistries.BLOCK.getKey(block))).useBlockDescriptionPrefix()')
    if (path.endsWith('/InitEntityTypes.java')) {
        ['card', 'card_deck'].each { name ->
            source = source.replace(".build(CCReference.location(\"${name}\").toString())", ".build(net.minecraft.resources.ResourceKey.create(net.minecraft.core.registries.Registries.ENTITY_TYPE, CCReference.location(\"${name}\")))")
        }
    }
    if (path.endsWith('/InitBlockEntityTypes.java')) source = source.replace(
        'BlockEntityType.Builder\n            .of(DDZTableBlockEntity::new, InitItems.DDZ_TABLE.get())\n            .build(null)',
        portLoader == 'fabric' ? 'net.fabricmc.fabric.api.object.builder.v1.block.entity.FabricBlockEntityTypeBuilder.create(DDZTableBlockEntity::new, InitItems.DDZ_TABLE.get()).build()'
            : 'new BlockEntityType<>(DDZTableBlockEntity::new, java.util.Set.of(InitItems.DDZ_TABLE.get()))')
    if (path.endsWith('/EntityCard.java') || path.endsWith('/EntityCardDeck.java')) {
        source = source.replace('boolean hurt(DamageSource', 'boolean hurtServer(net.minecraft.server.level.ServerLevel level, DamageSource')
    }
    source = source.replace('BuiltInRegistries.ITEM.get(', 'BuiltInRegistries.ITEM.getValue(')
    source = source.replace('mc.getTimer()', 'mc.getDeltaTracker()')
    if (path.endsWith('/ClientSounds.java')) source = source.replace('event.getLocation()', 'event.location()')
    if (path.endsWith('/UnitChatMessage.java')) source = source.replace('player.sendSystemMessage(', 'if (player instanceof net.minecraft.world.entity.player.Player recipient) recipient.displayClientMessage(')
        .replace('.append(message.withStyle(format))\n            );', '.append(message.withStyle(format)), false\n            );')
    if (path.endsWith('/TableConfigScreen.java')) source = source.replace('item.getDescription()', 'item.getName()')
    if (path.endsWith('/DDZGameHud.java') && mcMinor <= 5) source = source.replace(
        'renderer.renderStatic(stack, ItemDisplayContext.GUI, 0xF000F0,\n            OverlayTexture.NO_OVERLAY, pose, guiGraphics.bufferSource(), mc.level, 0);',
        'guiGraphics.drawSpecial(buffers -> renderer.renderStatic(stack, ItemDisplayContext.GUI, 0xF000F0,\n            OverlayTexture.NO_OVERLAY, pose, buffers, mc.level, 0));')
    if (mcMinor >= 4) {
        if (path.endsWith('/CardHelper.java')) source = source.replace('import net.minecraft.client.resources.model.BakedModel;', '')
            .replace('        BakedModel model = renderer.getModel(stack, level, null, 0);\n', '')
        if (path.endsWith('/ItemHelper.java')) source = source.replace('stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));', '''stack.set(DataComponents.CUSTOM_DATA, CustomData.of(tag));
        if (stack.getItem() == com.jokernan.craftycards.init.InitItems.CARD_COVERED.get())
            stack.set(DataComponents.ITEM_MODEL, com.jokernan.craftycards.CCReference.location("card_covered_" + Math.clamp(tag.getByte("SkinID"), 0, 3)));''')
    }
    if (mcMinor >= 5) {
        // Preserve 1.21.1's defaults when optional NBT entries are absent.
        [Byte:'(byte) 0', Int:'0', Long:'0L', Float:'0F', Boolean:'false', String:'""'].each { type, fallback ->
            source = source.replaceAll(/\.get${type}\(("[^"\n]*"|TAG_[A-Z_]+)\)/) { all, key -> ".get${type}Or(${key}, ${fallback})" }
        }
        source = source.replaceAll(/\.get(ByteArray|IntArray)\(("[^"\n]*"|TAG_[A-Z_]+)\)/) { all, type, key ->
            ".get${type}(${key}).orElseGet(() -> new ${type == 'ByteArray' ? 'byte' : 'int'}[0])"
        }
        source = source.replaceAll(/\.getList\(("[^"\n]*"|TAG_[A-Z_]+),\s*\d+\)/) { all, key -> ".getListOrEmpty(${key})" }
        source = source.replaceAll(/\.getUUID\(("[^"\n]*"|TAG_[A-Z_]+)\)/) { all, key -> ".read(${key}, net.minecraft.core.UUIDUtil.CODEC).orElse(null)" }
        source = source.replaceAll(/\.hasUUID\(("[^"\n]*"|TAG_[A-Z_]+)\)/) { all, key -> ".read(${key}, net.minecraft.core.UUIDUtil.CODEC).isPresent()" }
        source = source.replaceAll(/\.putUUID\(("[^"\n]*"|TAG_[A-Z_]+),\s*/) { all, key -> ".store(${key}, net.minecraft.core.UUIDUtil.CODEC, " }
        if (path.endsWith('/GameStatePayload.java')) source = source.replace('list.getString(i)', 'list.getStringOr(i, "")').replace('n.getAsString()', 'n.asString().orElse("")')
        if (path.endsWith('/EntityCard.java')) source = source
            .replace('EntityDataAccessor<Optional<UUID>>', 'EntityDataAccessor<String>')
            .replace('EntityDataSerializers.OPTIONAL_UUID', 'EntityDataSerializers.STRING')
            .replace('Optional.of(deckUUID)', 'deckUUID.toString()')
            .replace('this.entityData.get(DECK_UUID).orElse(null)', 'this.entityData.get(DECK_UUID).isEmpty() ? null : UUID.fromString(this.entityData.get(DECK_UUID))')
            .replace('builder.define(DECK_UUID, Optional.empty())', 'builder.define(DECK_UUID, "")')
            .replace('Optional.of(tag.read("DeckID", net.minecraft.core.UUIDUtil.CODEC).orElse(null))', 'tag.read("DeckID", net.minecraft.core.UUIDUtil.CODEC).map(UUID::toString).orElse("")')
        if (path.endsWith('/NeoForgeTableEvents.java')) source = source.replace('import net.neoforged.neoforge.common.util.TriState;', 'import net.minecraft.util.TriState;')
        if (path.endsWith('/ItemCard.java') || path.endsWith('/ItemCardCovered.java') || path.endsWith('/ItemCardDeck.java')) {
            source = source.replace('List<Component> pTooltipComponents, TooltipFlag pIsAdvanced', 'net.minecraft.world.item.component.TooltipDisplay tooltipDisplay, java.util.function.Consumer<Component> pTooltipComponents, TooltipFlag pIsAdvanced')
                .replace('pTooltipComponents.add(', 'pTooltipComponents.accept(')
                .replace('super.appendHoverText(pStack, pContext, pTooltipComponents, pIsAdvanced)', 'super.appendHoverText(pStack, pContext, tooltipDisplay, pTooltipComponents, pIsAdvanced)')
                .replace('Level pLevel, Entity pEntity, int pSlotId, boolean pIsSelected', 'net.minecraft.server.level.ServerLevel pLevel, Entity pEntity, net.minecraft.world.entity.EquipmentSlot slot')
                .replace('player.getInventory().getItem(pSlotId).shrink(1)', 'pStack.shrink(1)')
        }
    }
    if (mcMinor >= 6) {
        source = source.replace('context.player().server.', 'context.player().level().getServer().')
            .replace('mc.levelRenderer.getTicks()', '(int) mc.level.getGameTime()')
        if (path.endsWith('/WorldHandCards.java') || path.endsWith('/WorldPlayedCards.java') || path.endsWith('/WorldTableChip.java')) source = source
            .replace('if (!ctx.frustum().isVisible(', 'if (ctx.frustum() != null && !ctx.frustum().isVisible(')
            .replace('if (!TableRenderBounds.visible(ctx.frustum(), pos))', 'if (ctx.frustum() != null && !TableRenderBounds.visible(ctx.frustum(), pos))')
        source = source.replace(', bus = EventBusSubscriber.Bus.MOD', '')
            .replace('.serverLevel()', '.level()')
            .replace('player.server.', 'player.level().getServer().')
            .replace('any.server.', 'any.level().getServer().')
            .replace('guiGraphics.flush()', 'guiGraphics.nextStratum()')
        if (portLoader == 'neoforge') source = source
            .replace('PacketDistributor.sendToServer(payload)', 'com.jokernan.craftycards.client.ModernClientNetworking.send(payload)')
            .replace('onRenderLevelStage(RenderLevelStageEvent event)', 'onRenderLevelStage(RenderLevelStageEvent.AfterTranslucentBlocks event)')
            .replace('if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_TRANSLUCENT_BLOCKS) return;', '')
        if (path.endsWith('/EntityStacked.java') || path.endsWith('/EntityCard.java') || path.endsWith('/EntityCardDeck.java')) {
            source = source.replace('readAdditionalSaveData(CompoundTag tag)', 'readAdditionalSaveData(net.minecraft.world.level.storage.ValueInput tag)')
                .replace('addAdditionalSaveData(CompoundTag tag)', 'addAdditionalSaveData(net.minecraft.world.level.storage.ValueOutput tag)')
                .replace('tag.getByteArray("Stack").orElseGet(() -> new byte[0])', 'tag.read("Stack", com.mojang.serialization.Codec.BYTE_BUFFER).map(java.nio.ByteBuffer::array).orElseGet(() -> new byte[0])')
                .replace('tag.putByteArray("Stack", ArrayHelper.toPrimitive(this.entityData.get(STACK)))', 'tag.store("Stack", com.mojang.serialization.Codec.BYTE_BUFFER, java.nio.ByteBuffer.wrap(ArrayHelper.toPrimitive(this.entityData.get(STACK))))')
        }
        if (path.endsWith('/DDZTableBlockEntity.java')) source = source
            .replace('saveAdditional(CompoundTag tag, HolderLookup.Provider registries)', 'saveAdditional(net.minecraft.world.level.storage.ValueOutput tag)')
            .replace('loadAdditional(CompoundTag tag, HolderLookup.Provider registries)', 'loadAdditional(net.minecraft.world.level.storage.ValueInput tag)')
            .replace('super.saveAdditional(tag, registries)', 'super.saveAdditional(tag)')
            .replace('super.loadAdditional(tag, registries)', 'super.loadAdditional(tag)')
            .replace('tag.contains(TAG_STAKE) ? tag.getIntOr(TAG_STAKE, 0) : 1', 'tag.getIntOr(TAG_STAKE, 1)')
            .replace('!tag.contains(TAG_ENABLED) || tag.getBooleanOr(TAG_ENABLED, false)', 'tag.getBooleanOr(TAG_ENABLED, true)')
        if (path.endsWith('/BlockEntityBase.java')) source = source
            .replace('Connection net,', 'Connection connection,')
            .replace('loadAdditional(pkt.getTag(), lookupProvider)', 'loadWithComponents(net.minecraft.world.level.storage.TagValueInput.create(net.minecraft.util.ProblemReporter.DISCARDING, lookupProvider, pkt.getTag()))')
            .replace('loadAdditional(tag, lookupProvider)', 'loadWithComponents(net.minecraft.world.level.storage.TagValueInput.create(net.minecraft.util.ProblemReporter.DISCARDING, lookupProvider, tag))')
            .replace('CompoundTag tag = new CompoundTag();\n        saveAdditional(tag, lookupProvider);\n        return tag;', 'return saveWithoutMetadata(lookupProvider);')
        if (path.endsWith('/DDZGameHud.java')) {
            source = source.replace('            renderFocusFrame(guiGraphics, snap);\n', '')
                .replace('slot.bx(), slot.by(), RenderConfig.hudCardScale(), slot.fan(), true, HudHandMetrics.cardDepth(i));',
                    'slot.bx(), slot.by(), RenderConfig.hudCardScale(), slot.fan(), true, HudHandMetrics.cardDepth(i));\n            if (i == ClientDDZData.getInstance().getScrollFocus()) renderFocusFrame(guiGraphics, snap);')
            source = source.replace('PoseStack pose = guiGraphics.pose();', 'var pose = guiGraphics.pose();')
                .replace('pose.pushPose()', 'pose.pushMatrix()').replace('pose.popPose()', 'pose.popMatrix()')
                .replace('pose.scale(viewport.scale(), viewport.scale(), 1F)', 'pose.scale(viewport.scale(), viewport.scale())')
                .replace('pose.translate(slot.bx(), slot.by(), HudHandMetrics.focusDepth(focus))', 'pose.translate(slot.bx(), slot.by())')
                .replace('pose.translate(slot.bx(), slot.by(), depth)', 'guiGraphics.nextStratum();\n        pose.translate(slot.bx(), slot.by())')
                .replace('pose.mulPose(Axis.ZP.rotationDegrees(slot.fan()))', 'pose.rotate((float) Math.toRadians(slot.fan()))')
            def start = source.indexOf('        float offsetY = bottomPivot ? 0.5F : 0F;')
            def end = source.indexOf('\n    }', start)
            source = source.substring(0, start) + '''        // Each card occupies its own GUI stratum, preserving left-to-right overlap.
        guiGraphics.nextStratum();
        var pose = guiGraphics.pose();
        pose.pushMatrix();
        pose.translate(px, py);
        pose.rotate((float) Math.toRadians(rotationZ));
        pose.translate(0F, bottomPivot ? -0.5F * scale : 0F);
        pose.scale(scale / 16F, scale / 16F);
        guiGraphics.renderItem(stack, -8, -8);
        pose.popMatrix();''' + source.substring(end)
            source = source.replace('int color = 0xFFFFD700;', 'int color = 0xFFFFD700;\n        guiGraphics.nextStratum();')
        }
    }
    if (mcMinor >= 9) {
        if (path.endsWith('/MouseHandlerMixin.java')) source = source
            .replace('method = "onPress"', 'method = "onButton"')
            .replace('long windowPointer, int button, int action, int modifiers,', 'long windowPointer, net.minecraft.client.input.MouseButtonInfo button, int action,')
            .replace('handleMouseClick(button, action)', 'handleMouseClick(button.button(), action)')
        source = source.replaceAll(/\.isClientSide(?!\()/, '.isClientSide()')
            .replace('.getGameProfile().getName()', '.getGameProfile().name()')
        if (path.endsWith('/ConfigScreenBase.java')) source = source.replace(
            'public void render(GuiGraphics guiGraphics, int index, int y, int x, int width, int height,\n                           int mouseX, int mouseY, boolean hovering, float partialTick) {',
            'public void renderContent(GuiGraphics guiGraphics, int mouseX, int mouseY, boolean hovering, float partialTick) {\n            int x = getContentX(), y = getContentY(), width = getContentWidth(), height = getContentHeight();')
        if (path.endsWith('/CraftyCards.java')) source = source.replace(
            'event.getCamera(), event.getFrustum(), event.getRenderTick(), event.getPartialTick()',
            'Minecraft.getInstance().gameRenderer.getMainCamera(), event.getLevelRenderer().getCapturedFrustum(), event.getLevelRenderer().getTicks(), Minecraft.getInstance().getDeltaTracker()')
        if (path.endsWith('/WorldHandCards.java') || path.endsWith('/WorldPlayedCards.java') || path.endsWith('/WorldTableChip.java')) source = source
            .replace('itemRenderer.renderStatic(', 'com.jokernan.craftycards.client.QueuedItemRenderer.renderStatic(')
            .replace('buffers.endBatch()', 'com.jokernan.craftycards.client.QueuedItemRenderer.flush();\n        buffers.endBatch()')
            .replace('if (!ctx.frustum().isVisible(', 'if (ctx.frustum() != null && !ctx.frustum().isVisible(')
            .replace('if (!TableRenderBounds.visible(ctx.frustum(), pos))', 'if (ctx.frustum() != null && !TableRenderBounds.visible(ctx.frustum(), pos))')
        if (path.endsWith('/CardHelper.java')) source = source.replace('renderer.renderStatic(', 'com.jokernan.craftycards.client.QueuedItemRenderer.renderStatic(')
        if (path.endsWith('/RenderEntityCard.java') || path.endsWith('/RenderEntityCardDeck.java')) source = source
            .replace('void render(CardEntityRenderState state, PoseStack pose, MultiBufferSource buffers, int light)', 'void submit(CardEntityRenderState state, PoseStack pose, net.minecraft.client.renderer.SubmitNodeCollector collector, net.minecraft.client.renderer.state.CameraRenderState camera)')
            .replace('super.render(state, pose, buffers, light)', 'super.submit(state, pose, collector, camera)')
            .replace('for (int i = 0; i < state.amount; i++)\n            CardHelper.renderItem(state.card, Minecraft.getInstance().level, 0, i * 0.003D, 0, pose, buffers, light);', '''for (int i = 0; i < state.amount; i++) {
            pose.pushPose();
            pose.translate(0, i * 0.003D, 0);
            com.jokernan.craftycards.client.QueuedItemRenderer.submit(state.card, net.minecraft.world.item.ItemDisplayContext.GROUND,
                state.lightCoords, 0, pose, collector, Minecraft.getInstance().level, 0);
            pose.popPose();
        }''')
    }
    if (portLoader == 'forge' && mcMinor >= 6) {
        source = source.replace('net.minecraftforge.eventbus.api.IEventBus', 'net.minecraftforge.eventbus.api.bus.BusGroup')
            .replace('IEventBus bus', 'BusGroup bus')
            .replace('net.minecraftforge.eventbus.api.SubscribeEvent', 'net.minecraftforge.eventbus.api.listener.SubscribeEvent')
            .replace('import net.minecraftforge.eventbus.api.Event;', 'import net.minecraftforge.common.util.Result;')
            .replace('Event.Result.ALLOW', 'Result.ALLOW')
        if (path.endsWith('/CraftyCardsForge.java')) source = source
            .replace('public CraftyCardsForge() {', 'public CraftyCardsForge(FMLJavaModLoadingContext context) {')
            .replace('FMLJavaModLoadingContext context = FMLJavaModLoadingContext.get();', '')
            .replace('context.getModEventBus()', 'context.getModBusGroup()')
            .replace('bus.addListener(this::setup)', 'FMLCommonSetupEvent.getBus(bus).addListener(this::setup)')
            .replace('ForgeTableEvents.register(MinecraftForge.EVENT_BUS)', 'ForgeTableEvents.register()')
        if (path.endsWith('/CraftyCardsForge.java')) {
            def smokeBootstrap = '''ForgeNetworking.register();
        if (System.getProperty("craftycards.smoke") != null) {
            try {
                if (net.minecraftforge.fml.loading.FMLEnvironment.dist == net.minecraftforge.api.distmarker.Dist.CLIENT)
                    Class.forName("com.jokernan.craftycards.smoke.ForgePocClient").getMethod("bootstrap").invoke(null);
                SERVER_SMOKE_BOOTSTRAP
            } catch (ReflectiveOperationException failure) {
                throw new IllegalStateException("Forge smoke bootstrap failed", failure);
            }
        }'''
            smokeBootstrap = smokeBootstrap.replace('SERVER_SMOKE_BOOTSTRAP', mcMinor >= 11
                ? '''else
                    Class.forName("com.jokernan.craftycards.smoke.ForgePoc").getConstructor().newInstance();'''
                : '')
            source = source.replace('ForgeNetworking.register();', smokeBootstrap)
        }
        if (path.endsWith('/ForgeTableEvents.java')) {
            source = source.replace('register(BusGroup bus)', 'register()')
            ['TickEvent.ServerTickEvent.Post', 'PlayerEvent.PlayerLoggedOutEvent', 'BlockEvent.BreakEvent', 'PlayerInteractEvent.RightClickBlock'].each { type ->
                source = source.replace("bus.addListener((${type} event)", "${type}.BUS.addListener((${type} event)")
            }
            // This listener observes break events; it never cancels them.
            source = source.replace('!event.isCanceled() && ', '')
            if (mcMinor >= 9) source = source.replace('event.getServer()', 'event.server()')
        }
        if (path.endsWith('/ForgeClient.java')) source = source
            .replace('MinecraftForge.EVENT_BUS.addListener((TickEvent.ClientTickEvent.Post tick)', 'TickEvent.ClientTickEvent.Post.BUS.addListener((TickEvent.ClientTickEvent.Post tick)')
            .replace('MinecraftForge.EVENT_BUS.addListener((ClientPlayerNetworkEvent.LoggingOut logout)', 'ClientPlayerNetworkEvent.LoggingOut.BUS.addListener((ClientPlayerNetworkEvent.LoggingOut logout)')
    }
    if (mcMinor >= 11) source = source.replace('ResourceLocation', 'Identifier')
        .replace('dimension().location()', 'dimension().identifier()')
        .replace('dimension.location()', 'dimension.identifier()')
        .replace('ctx.camera().getPosition()', 'ctx.camera().position()')
    if (mcMinor >= 5 && path.endsWith('/DDZGameHud.java')) {
        // From 1.21.6, GuiGraphics.renderItem first rasterizes into a fixed-size item atlas.
        // Render the original card-face pixels at the final HUD size on 1.21.5+;
        // world cards continue to use their 3D item models.
        def start = source.indexOf('    private void renderCardStack(')
        def end = source.indexOf('\n    }', start)
        if (start < 0 || end < 0) throw new GradleException('Modern HUD card renderer anchor missing')
        def directHudCards = '''    private void renderCardStack(GuiGraphics guiGraphics, ItemStack stack, float px, float py,
                                 float scale, float rotationZ, boolean bottomPivot, float depth) {
        int cardW = Math.round(scale * 10.2F / 16F);
        int cardH = Math.round(scale);
        int left = -cardW / 2;
        int top = bottomPivot ? -cardH : -cardH / 2;
        var pose = guiGraphics.pose();
        CARD_POSE_PUSH
        CARD_STRATUM
        CARD_TRANSLATE
        CARD_ROTATE
        CARD_BLIT
        CARD_POSE_POP
    }

    private static net.minecraft.resources.CARD_LOCATION_TYPE cardFaceTexture(int id) {
        if (id == 52) return CCReference.location("textures/item/cards/card_joker_small.png");
        if (id == 53) return CCReference.location("textures/item/cards/card_joker_big.png");
        String rank = switch (id / 4 + 1) {
            case 1 -> "ace";
            case 11 -> "jack";
            case 12 -> "queen";
            case 13 -> "king";
            default -> Integer.toString(id / 4 + 1);
        };
        String suit = switch (id % 4) {
            case 0 -> "spades";
            case 1 -> "clubs";
            case 2 -> "diamonds";
            default -> "hearts";
        };
        return CCReference.location("textures/item/cards/card_" + rank + "_" + suit + ".png");
    }'''
        if (mcMinor == 5) directHudCards = directHudCards
            .replace('CARD_POSE_PUSH', 'pose.pushPose();')
            .replace('CARD_STRATUM', 'guiGraphics.flush();')
            .replace('CARD_TRANSLATE', 'pose.translate(px, py, depth);')
            .replace('CARD_ROTATE', 'pose.mulPose(Axis.ZP.rotationDegrees(rotationZ));')
            .replace('CARD_BLIT', 'guiGraphics.blit(net.minecraft.client.renderer.RenderType::guiTextured, cardFaceTexture(stack.getDamageValue()),\n            left, top, 0F, 0F, cardW, cardH, 33, 51, 64, 64);')
            .replace('CARD_POSE_POP', 'pose.popPose();')
        else directHudCards = directHudCards
            .replace('CARD_POSE_PUSH', 'pose.pushMatrix();')
            .replace('CARD_STRATUM', 'guiGraphics.nextStratum();')
            .replace('CARD_TRANSLATE', 'pose.translate(px, py);')
            .replace('CARD_ROTATE', 'pose.rotate((float) Math.toRadians(rotationZ));')
            .replace('CARD_BLIT', 'guiGraphics.blit(cardFaceTexture(stack.getDamageValue()), left, top,\n            left + cardW, top + cardH, 0F, 33F / 64F, 0F, 51F / 64F);')
            .replace('CARD_POSE_POP', 'pose.popMatrix();')
        directHudCards = directHudCards.replace('CARD_LOCATION_TYPE', mcMinor >= 11 ? 'Identifier' : 'ResourceLocation')
        source = source.substring(0, start) + directHudCards + source.substring(end + 6)
    }
    source
}

