name: 功能建议
description: 希望增加或调整的玩法、界面、兼容性
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，避免重复。功能建议不承诺实现，但会按版本分支归档。

  - type: dropdown
    id: target
    attributes:
      label: 面向哪个版本
      options:
        - "1.21.1（主要维护）"
        - "1.21.2 – 1.21.11"
        - "不确定 / 都适用"
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 想要的功能
      description: 描述你希望看到的行为
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 解决了什么问题，或者在什么场景下有用
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在你是怎么绕过的，或者考虑过哪些做法

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己提交 PR 实现这个功能
