name: build-reusable

on:
  workflow_call:
    inputs:
      mc_target:
        description: "Minecraft target passed to -PmcTarget"
        required: false
        type: string
        default: "1.21.1"
      loader:
        description: "Loader name, used for the job title and artifact name"
        required: false
        type: string
        default: "neoforge"

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.loader }} / ${{ inputs.mc_target }}
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: .\gradlew.bat build -PmcTarget=${{ inputs.mc_target }} --no-configuration-cache

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.loader }}-${{ inputs.mc_target }}
          path: build/mc-${{ inputs.mc_target }}/reports/tests/test
          if-no-files-found: ignore
